<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Cloud Appliance | FMW Next</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171413;color:#EFEAE6;
       font-family:Calibri,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:17px}
  .box{text-align:center}
  .spin{width:42px;height:42px;border-radius:50%;border:4px solid #3A3330;border-top-color:#C74634;margin:0 auto 16px;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><p>Unlocking&hellip;</p></div>
<script src="/assets/fmw-crypto.js"></script>
<script>
  (async function () {
    var back = "/login.html?next=" + encodeURIComponent(location.pathname + location.hash);
    var keys = FMW.load();
    if (!keys) { location.replace(back); return; }
    try {
      var html = FMW.text(await FMW.decryptFile("content.enc", keys.k));
      document.open(); document.write(html); document.close();
    } catch (e) {
      FMW.clear();
      location.replace(back + "&error=1");
    }
  })();
</script>
</body>
</html>
